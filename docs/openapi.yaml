openapi: 3.0.3

info:
  title: Pass Parking — API application agents
  version: 1.5.2
  description: |
    API REST de l'application mobile des **agents parking** et des **chefs agent parking**.

    L'application est volontairement simple. L'agent peut seulement :
    1. **scanner** le QR code d'un pass pour le **vérifier** ;
    2. **valider** l'entrée ou la sortie du véhicule ;
    3. consulter **l'historique des passages qu'il a effectués**.

    Le chef agent parking fait la même chose, et dispose en plus de la **supervision** de son événement
    (statistiques, historique de tous les passages) et du **passage forcé**.

    ---

    ## 1. Aucun choix d'événement côté app

    L'agent ne sélectionne **jamais** d'événement. Chaque QR code identifie un pass, qui appartient à
    un événement : **le serveur vérifie lui-même** que l'agent est affecté (comme agent ou chef) à
    l'événement de ce pass. Un pass d'un événement auquel l'agent n'est pas affecté est refusé
    (`reason = not_assigned`) et ses données ne sont pas révélées.

    ## 2. Parcours d'un contrôle

    ```
    Scan du QR code
         │
         ▼
    POST /verify ──► valid = false ──► écran ROUGE : message
         │                              └─ si can_force = true (chef) : bouton « Forcer »
         │                                   → POST /scans { force: true }
         │ valid = true
         ▼
    Écran VERT : type de pass (couleur), IMMATRICULATION, marque, couleur,
                 sens prévu (next_direction : ENTRÉE / SORTIE)
         │
         └─ l'agent compare avec le véhicule et appuie sur « Valider »
              → POST /scans { code }   ──► 201 : passage enregistré
    ```

    - `POST /verify` **n'enregistre rien** : il peut être rappelé sans risque.
    - `POST /scans` **revérifie tout** côté serveur : l'app n'a pas besoin de renvoyer le résultat de `verify`.
    - **Entrée ou sortie ?** Déduit automatiquement : un véhicule dehors entre, un véhicule dans le
      parking sort. Un pass permet un nombre illimité d'entrées/sorties. L'app peut imposer le sens
      avec `direction` (ex. agent posté à une sortie).
    - Envoyez un **`client_uuid`** (UUID v4 généré par l'app) avec chaque validation : si le réseau
      coupe et que l'app renvoie la requête, aucun doublon n'est créé.
    - Envoyez la **position GPS** de l'agent (`latitude`, `longitude`, `accuracy` en mètres) avec
      chaque passage : l'administrateur la consulte dans l'historique de chaque agent. Demandez la
      permission de localisation à la connexion ; si la position est indisponible, omettez ces
      champs (le passage est quand même enregistré).

    ## 3. Identifier le véhicule : QR code ou immatriculation

    **QR code** (cas normal) : envoyez le contenu **brut** du QR code dans `code` :
    - URL complète : `https://pass.exemple.com/p/o5kZFFrJ3NA8` ;
    - ou jeton seul : `o5kZFFrJ3NA8`.

    Tout autre contenu renvoie `reason = unknown_pass`.

    **Saisie manuelle** (QR code oublié, abîmé ou illisible) : envoyez l'immatriculation dans
    `plate` à la place de `code`, dans **n'importe quel format** : `1234 AB 01`, `1234-ab-01` et
    `1234ab01` désignent le même véhicule (espaces, tirets, points et casse sont ignorés).
    - Les contrôles sont exactement les mêmes qu'avec le QR code.
    - Seuls les véhicules des événements de l'agent sont trouvés (`unknown_plate` sinon).
    - Si le véhicule a un pass sur **plusieurs** événements de l'agent : `reason = multiple_matches`
      et la liste `matches` ; faites choisir l'événement puis renvoyez la requête avec
      `code = matches[i].pass.token`.
    - Chaque passage enregistre `method` (`qr` ou `plate`) : les saisies manuelles sont signalées
      dans les historiques et les statistiques du chef.
    - Tolérance : une immatriculation envoyée par erreur dans `code` est reconnue comme une saisie
      manuelle (`method = plate`). Préférez néanmoins `plate` pour une saisie manuelle.

    ## 4. Droits

    | Action | Agent | Chef agent parking | Admin |
    |---|---|---|---|
    | `POST /verify`, `POST /scans` (pass de ses événements) | ✅ | ✅ | ✅ tous |
    | Forcer un pass non valide (`force: true`) | ❌ | ✅ son événement | ✅ |
    | `GET /scans/history` (ses propres passages) | ✅ | ✅ | ✅ |
    | `GET /events`, `/events/{event}/stats`, `/events/{event}/scans` | ❌ | ✅ son événement | ✅ |
    | `GET /sync`, `POST /scans/batch` (hors ligne) | ✅ | ✅ | ✅ |

    Pour savoir s'il faut afficher l'onglet **Supervision**, appelez `GET /events` : il n'est utile que
    si au moins un événement a `can_supervise = true`.

    ## 5. Motifs de refus (`reason`)

    | reason | Message (champ `message`) | Pass renvoyé | Forçable par le chef |
    |---|---|---|---|
    | `unknown_pass` | QR code inconnu. | non | non |
    | `not_assigned` | Vous n'êtes pas affecté à l'événement de ce pass. | non | non |
    | `event_closed` | L'événement est clôturé. | oui | **non** (aucune exception) |
    | `not_registered` | Aucun véhicule n'est enregistré sur ce pass. | oui | oui |
    | `revoked` | Ce pass a été révoqué. | oui | oui |
    | `unknown_plate` | Aucun véhicule enregistré avec cette immatriculation sur vos événements. | non | non |
    | `multiple_matches` | Ce véhicule a un pass sur plusieurs de vos événements : choisissez l'événement. | non (voir `matches`) | non |

    Affichez `message` (en français) ; utilisez `reason` et `can_force` pour la logique de l'app.

    ## 6. Mode hors ligne (optionnel)

    1. Quand le réseau est disponible : `GET /sync` (première fois), puis `GET /sync?since=<server_time>`.
       Une seule synchro couvre **tous** les événements de l'agent. Fusionnez les pass par `id`.
       Pour la saisie manuelle hors ligne, comparez la plaque saisie (sans espaces, tirets ni
       points, en majuscules) à `vehicle.plate_key`.
    2. Sans réseau : retrouvez le pass par `token`, appliquez les règles du §5, comparez le véhicule,
       mettez à jour `presence` localement et mettez le passage en file d'attente avec un `client_uuid`
       et l'heure du scan.
    3. Au retour du réseau : `POST /scans/batch` (500 passages max). Idempotent : renvoyez le lot
       tant que la réponse n'a pas été reçue.

    ## 7. Conventions

    - **En-têtes** : `Accept: application/json` sur **toutes** les requêtes ;
      `Content-Type: application/json` pour les corps.
    - **Connexion** : **numéro de téléphone + mot de passe** (`POST /auth/login`). Le numéro est
      reconnu quel que soit le format saisi (espaces, points, tirets) mais l'indicatif doit être le même
      que celui enregistré par l'administrateur (`+225 07…` et `07…` sont deux numéros différents).
    - **Authentification** : `Authorization: Bearer <token>` (via `POST /auth/login`). Le token
      n'expire pas ; il est invalidé par `POST /auth/logout` ou si le compte est désactivé (`403`).
    - **Dates** : ISO 8601 UTC en sortie (`2026-10-14T18:00:00.000000Z`) ; en entrée, tout ISO 8601
      avec fuseau (`2026-10-14T18:03:12+00:00`).
    - **Erreurs** : `401` → retour à l'écran de connexion ; `403` compte désactivé → idem ;
      `422` → `message` à afficher (`errors` détaille les champs en cas de validation).

  contact:
    name: Équipe Pass Parking
  license:
    name: Propriétaire — usage interne

