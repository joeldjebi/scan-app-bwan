servers:
  - url: /api/v1
    description: Serveur courant

tags:
  - name: Authentification
    description: Connexion de l'agent et gestion du token.
  - name: Contrôle
    description: Scanner, vérifier et valider l'entrée / la sortie d'un véhicule. **Agents et chefs.**
  - name: Historique
    description: Passages effectués par l'utilisateur connecté. **Agents et chefs.**
  - name: Supervision
    description: Réservé au **chef agent parking** de l'événement (et aux administrateurs).
  - name: Hors ligne
    description: Optionnel — synchronisation des pass et envoi différé des passages.

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      description: |
        Échange le **numéro de téléphone** et le mot de passe contre un **token d'accès**, à stocker de façon sécurisée
        (Keychain / Keystore). Chaque appareil reçoit son propre token. `device_name` est **facultatif** :
        il sert seulement à reconnaître l'appareil dans le journal.

        Limité à **10 tentatives par minute** (au-delà : `429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+225 07 02 02 02 00'
              password: password
              device_name: Samsung A54 - Awa
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: 3|kV8XyQm2fP0aLr7sT1uW9bZc4dE6gH5jK2nM8pQ0
                user:
                  id: 3
                  name: Awa Agent
                  email: null
                  phone: '+2250702020200'
                  role: agent
        '422':
          description: Champs manquants, identifiants incorrects ou compte désactivé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                identifiants:
                  summary: Téléphone ou mot de passe incorrect
                  value:
                    message: Numéro de téléphone ou mot de passe incorrect.
                    errors:
                      phone: [Numéro de téléphone ou mot de passe incorrect.]
                desactive:
                  summary: Compte désactivé
                  value:
                    message: Votre compte est désactivé.
                    errors:
                      phone: [Votre compte est désactivé.]
                validation:
                  summary: Champ manquant
                  value:
                    message: Le champ mot de passe est obligatoire.
                    errors:
                      password: [Le champ mot de passe est obligatoire.]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Authentification]
      operationId: me
      summary: Utilisateur connecté
      description: À appeler au démarrage de l'app pour vérifier que le token stocké est toujours valide.
      responses:
        '200':
          description: Utilisateur connecté.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Se déconnecter
      description: Révoque le token utilisé pour l'appel. Les autres appareils de l'agent restent connectés.
      responses:
        '200':
          description: Token révoqué.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Déconnecté.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /verify:
    post:
      tags: [Contrôle]
      operationId: verifyPass
      summary: Vérifier un QR code
      description: |
        **Étape 1.** Le serveur retrouve le pass, son événement, vérifie que l'utilisateur y est affecté
        puis contrôle le pass. **N'enregistre aucun passage.**

        Réponse toujours `200` si la requête est bien formée : testez `valid`.

        **Écran conseillé quand `valid = true`** :
        - bandeau à la couleur `pass.type.color` avec `pass.type.name` et `event.name` ;
        - **immatriculation en très grand** (`pass.vehicle.plate`), puis marque et couleur ;
        - sens prévu : `pass.next_direction` (`in` → « ENTRÉE », `out` → « SORTIE ») ;
        - bouton **Valider**.

        **Quand `valid = false`** : afficher `message`. Si `can_force = true` (chef de l'événement),
        proposer « Forcer le passage ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              url:
                summary: Contenu brut du QR code (recommandé)
                value:
                  code: https://pass.exemple.com/p/o5kZFFrJ3NA8
              token:
                summary: Jeton seul
                value:
                  code: o5kZFFrJ3NA8
              plaque:
                summary: Saisie manuelle de l'immatriculation (tout format)
                value:
                  plate: 1000-ab-01
      responses:
        '200':
          description: Résultat de la vérification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              examples:
                valide:
                  summary: Pass valide (véhicule dehors → entrée)
                  value:
                    valid: true
                    reason: null
                    message: Pass valide.
                    method: qr
                    can_force: false
                    event: *EventRef
                    pass: *PassRegistered
                    matches: []
                plaque_inconnue:
                  summary: Immatriculation saisie inconnue
                  value:
                    valid: false
                    reason: unknown_plate
                    message: Aucun véhicule enregistré avec cette immatriculation sur vos événements.
                    method: plate
                    can_force: false
                    event: null
                    pass: null
                    matches: []
                plusieurs_evenements:
                  summary: Plaque présente sur 2 événements de l'agent
                  value:
                    valid: false
                    reason: multiple_matches
                    message: "Ce véhicule a un pass sur plusieurs de vos événements : choisissez l'événement."
                    method: plate
                    can_force: false
                    event: null
                    pass: null
                    matches:
                      - event: *EventRef
                        pass: *PassRegistered
                non_enregistre_agent:
                  summary: Aucun véhicule enregistré (agent)
                  value:
                    valid: false
                    reason: not_registered
                    message: Aucun véhicule n'est enregistré sur ce pass.
                    can_force: false
                    event: *EventRef
                    pass: *PassPending
                revoque_chef:
                  summary: Pass révoqué (chef → peut forcer)
                  value:
                    valid: false
                    reason: revoked
                    message: Ce pass a été révoqué.
                    can_force: true
                    event: *EventRef
                    pass: *PassRevoked
                non_affecte:
                  summary: Pass d'un événement auquel l'agent n'est pas affecté
                  value:
                    valid: false
                    reason: not_assigned
                    message: Vous n'êtes pas affecté à l'événement de ce pass.
                    can_force: false
                    event: null
                    pass: null
                inconnu:
                  summary: QR code inconnu
                  value:
                    valid: false
                    reason: unknown_pass
                    message: QR code inconnu.
                    can_force: false
                    event: null
                    pass: null
                cloture:
                  summary: Événement clôturé
                  value:
                    valid: false
                    reason: event_closed
                    message: L'événement est clôturé.
                    can_force: false
                    event: *EventRef
                    pass: *PassRegistered
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /scans:
    post:
      tags: [Contrôle]
      operationId: validateScan
      summary: Valider l'entrée / la sortie
      description: |
        **Étape 2.** Enregistre le passage. Le serveur **refait toutes les vérifications** de `/verify`.

        - **Sens** : si `direction` est absent, il est déduit (`next_direction` du pass).
        - **Pass valide** → `201`, le passage est enregistré et la position du véhicule (`pass.presence`)
          est mise à jour.
        - **Pass non valide** → `422` avec `reason` et `can_force`, rien n'est enregistré.
          Si `can_force = true`, le chef peut renvoyer la même requête avec `force: true` : le passage
          est alors enregistré avec `forced = true`.
        - **Idempotence** : si `client_uuid` a déjà été reçu, le passage existant est renvoyé en `200`
          sans rien modifier.

        *Optionnel* : `result = denied` permet de tracer un refus (ex. véhicule non conforme) dans
        l'historique ; la position du véhicule ne change pas. Si l'app ne propose pas de bouton
        « Refuser », ne l'envoyez jamais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            examples:
              valider:
                summary: Valider (cas standard, avec position)
                value:
                  code: https://pass.exemple.com/p/o5kZFFrJ3NA8
                  client_uuid: 6f1c1c1e-0b7e-4f7a-9d6e-2c1a3b4c5d6e
                  device_id: A54-AWA
                  latitude: 5.3197012
                  longitude: -4.0167293
                  accuracy: 12
              plaque:
                summary: Valider par saisie de l'immatriculation
                value:
                  plate: 1000 AB 01
                  client_uuid: 2b8f1c3e-7d4a-4e5f-9a6b-1c2d3e4f5a6b
              sortie:
                summary: Imposer le sens (poste de sortie)
                value:
                  code: o5kZFFrJ3NA8
                  direction: out
                  client_uuid: 9a4e7d0c-1b2f-4c3d-8e5f-6a7b8c9d0e1f
              forcer:
                summary: Forcer un pass non valide (chef)
                value:
                  code: 4I3a7T4VRBqQ
                  force: true
                  reason: Invité de dernière minute
                  client_uuid: 3c2b1a09-8f7e-4d6c-9b5a-4e3d2c1b0a99
              refuser:
                summary: Tracer un refus (optionnel)
                value:
                  code: o5kZFFrJ3NA8
                  result: denied
                  reason: Plaque différente
                  client_uuid: 0b9d6a52-8c1d-4a55-b0b5-7f6f2a7b1c11
      responses:
        '201':
          description: Passage enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
              example:
                scan: *ScanEntry
                pass: *PassInside
        '200':
          description: '`client_uuid` déjà reçu : le passage existant est renvoyé, rien n''est modifié.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
              example:
                scan: *ScanEntry
                pass: *PassInside
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          description: |
            **Passage refusé** (pass non valide : présence de `reason`) **ou** données invalides
            (présence de `errors`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ScanRefused'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                agent:
                  summary: Agent — pass sans véhicule
                  value:
                    message: Aucun véhicule n'est enregistré sur ce pass.
                    reason: not_registered
                    can_force: false
                    matches: []
                chef_peut_forcer:
                  summary: Chef sans `force` — peut renvoyer avec force=true
                  value:
                    message: Ce pass a été révoqué.
                    reason: revoked
                    can_force: true
                    matches: []
                non_affecte:
                  summary: Pass d'un autre événement
                  value:
                    message: Vous n'êtes pas affecté à l'événement de ce pass.
                    reason: not_assigned
                    can_force: false
                    matches: []
                validation:
                  summary: Erreur de validation
                  value:
                    message: Le champ code est obligatoire.
                    errors:
                      code: [Le champ code est obligatoire.]

  /scans/history:
    get:
      tags: [Historique]
      operationId: myHistory
      summary: Mon historique de passages
      description: |
        Passages effectués par **l'utilisateur connecté** (tous événements confondus), du plus récent
        au plus ancien, **30 par page**. Chargez la page suivante avec `links.next` (`null` = fin).

        Chaque ligne indique le pass (numéro, immatriculation, type), l'événement, le sens, le résultat
        et l'heure. `pass` et `event` sont `null` pour un QR code inconnu ou hors de vos événements.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Page de l'historique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScans'
              example:
                data:
                  - *ScanEntry
                  - id: 11
                    client_uuid: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    direction: in
                    result: denied
                    method: qr
                    reason: unknown_pass
                    forced: false
                    offline: false
                    scanned_at: '2026-10-14T18:01:40.000000Z'
                    location: null
                    event: null
                    pass: null
                links:
                  first: https://pass.exemple.com/api/v1/scans/history?page=1
                  last: https://pass.exemple.com/api/v1/scans/history?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: https://pass.exemple.com/api/v1/scans/history
                  per_page: 30
                  to: 2
                  total: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /events:
    get:
      tags: [Supervision]
      operationId: listEvents
      summary: Mes événements (chef)
      description: |
        Événements non clôturés auxquels l'utilisateur est affecté (tous pour un admin), avec son rôle.
        **Utile uniquement au chef** : choisir l'événement à superviser. Afficher l'onglet Supervision
        seulement si au moins un événement a `can_supervise = true`.
      responses:
        '200':
          description: Liste des événements.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
              example:
                data:
                  - *EventChief
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /events/{event}/stats:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Supervision]
      operationId: eventStats
      summary: Tableau de bord de l'événement
      description: |
        Compteurs en temps réel. **Chef de l'événement (ou admin) uniquement.**

        - `passes.inside` : véhicules actuellement dans le parking.
        - `scans.entries` / `scans.exits` : passages **autorisés** (un véhicule peut entrer plusieurs fois).
        - `scans.denied` : refus tracés.
      responses:
        '200':
          description: Statistiques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
              example:
                passes: { total: 60, pending: 52, registered: 8, revoked: 0, inside: 3 }
                scans: { entries: 5, exits: 2, denied: 1, manual: 1 }
                by_type:
                  - { id: 1, name: VIP, color: '#b45309', total: 20, registered: 8, inside: 3 }
                  - { id: 2, name: Staff, color: '#059669', total: 30, registered: 0, inside: 0 }
                  - { id: 3, name: Presse, color: '#7c3aed', total: 10, registered: 0, inside: 0 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotEventChief'
        '404':
          $ref: '#/components/responses/EventNotFound'

  /events/{event}/scans:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Supervision]
      operationId: eventScans
      summary: Historique de tous les passages de l'événement
      description: |
        Passages de **tous les agents** de l'événement, du plus récent au plus ancien, **50 par page**.
        Chaque ligne indique l'agent (`agent`). **Chef de l'événement (ou admin) uniquement.**
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Page de passages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScans'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotEventChief'
        '404':
          $ref: '#/components/responses/EventNotFound'

  /sync:
    get:
      tags: [Hors ligne]
      operationId: sync
      summary: Télécharger les pass de mes événements
      description: |
        Renvoie les événements non clôturés de l'utilisateur et **tous leurs pass** (tous statuts), pour
        vérifier sans réseau.

        - **Première synchro** : sans `since` → tout (`full = true`) ; remplacez le cache local.
        - **Synchros suivantes** : `since` = `server_time` précédent → pass créés ou modifiés depuis,
          plus **tous** les pass des événements auxquels l'agent a été affecté entre-temps
          (`full = false`). **Fusionnez par `id`** (le filtre est inclusif). Remplacez la liste des
          événements par `events` : un événement absent n'est plus à contrôler (retirez ses pass).
        - **Pass supprimés** par l'administrateur : leurs `id` sont dans `deleted_pass_ids` ;
          retirez-les du cache local (leur QR code n'est plus reconnu).
      parameters:
        - name: since
          in: query
          required: false
          description: '`server_time` de la synchronisation précédente (ISO 8601).'
          schema:
            type: string
            format: date-time
          example: '2026-10-14T18:05:00+00:00'
      responses:
        '200':
          description: Pass à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              example:
                server_time: '2026-10-14T18:05:00+00:00'
                full: true
                events:
                  - *EventAgent
                passes:
                  - *PassRegistered
                  - *PassPending
                deleted_pass_ids: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /scans/batch:
    post:
      tags: [Hors ligne]
      operationId: batchScans
      summary: Envoyer les passages faits hors ligne
      description: |
        Jusqu'à **500 passages** enregistrés sans réseau.

        - La décision prise hors ligne est **conservée** (`offline = true`) ; le serveur contrôle seulement
          que le pass appartient à un événement de l'utilisateur. Sinon le passage est historisé sans
          pass (`reason = unknown_pass` ou `not_assigned`).
        - Appliqués **par ordre chronologique** (`scanned_at`) : la position finale du véhicule est celle
          du dernier passage autorisé.
        - **Idempotent** : un `client_uuid` déjà reçu est ignoré (`duplicate`).
        - Si la validation échoue (`422`), **aucun** passage du lot n'est enregistré.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchScanRequest'
            example:
              scans:
                - client_uuid: 6f1c1c1e-0b7e-4f7a-9d6e-2c1a3b4c5d6e
                  code: https://pass.exemple.com/p/o5kZFFrJ3NA8
                  result: granted
                  direction: in
                  scanned_at: '2026-10-14T18:03:12+00:00'
                  device_id: A54-AWA
                  latitude: 5.3197012
                  longitude: -4.0167293
                  accuracy: 12
                - client_uuid: 9a4e7d0c-1b2f-4c3d-8e5f-6a7b8c9d0e1f
                  code: o5kZFFrJ3NA8
                  result: granted
                  direction: out
                  scanned_at: '2026-10-14T21:47:05+00:00'
                  device_id: A54-AWA
      responses:
        '200':
          description: Lot traité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchScanResponse'
              example:
                created: 1
                duplicates: 1
                results:
                  - client_uuid: 6f1c1c1e-0b7e-4f7a-9d6e-2c1a3b4c5d6e
                    status: duplicate
                  - client_uuid: 9a4e7d0c-1b2f-4c3d-8e5f-6a7b8c9d0e1f
                    status: created
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          description: Lot invalide (rien n'est enregistré). Les champs en erreur sont indexés (`scans.1.scanned_at`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: Le champ date du passage est obligatoire.
                errors:
                  scans.1.scanned_at: [Le champ date du passage est obligatoire.]

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token obtenu via `POST /auth/login`, au format `<id>|<secret>`. En-tête : `Authorization: Bearer 3|kV8Xy...`'

  parameters:
    EventId:
      name: event
      in: path
      required: true
      description: Identifiant de l'événement (`id` renvoyé par `GET /events`).
      schema:
        type: integer
        minimum: 1
      example: 1
    Page:
      name: page
      in: query
      required: false
      description: Numéro de page (commence à 1).
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    Unauthenticated:
      description: Token absent, invalide ou révoqué. Retour à l'écran de connexion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Unauthenticated.
    AccountDisabled:
      description: Compte désactivé par l'administrateur. Le token est révoqué ; retour à l'écran de connexion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Compte désactivé.
    NotEventChief:
      description: Réservé au chef agent parking de l'événement et aux administrateurs (ou compte désactivé).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          examples:
            non_chef:
              summary: Pas chef de cet événement
              value:
                message: This action is unauthorized.
            desactive:
              summary: Compte désactivé
              value:
                message: Compte désactivé.
    EventNotFound:
      description: Événement inexistant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: No query results for model [App\Models\Event] 99
    ValidationFailed:
      description: Données invalides.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: Le champ code est obligatoire.
            errors:
              code: [Le champ code est obligatoire.]
    TooManyRequests:
      description: Trop de tentatives. Réessayez après le délai de l'en-tête `Retry-After` (secondes).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Too Many Attempts.

  schemas:

    # ---------- Énumérations ----------

    UserRole:
      type: string
      enum: [admin, agent]
      description: Rôle global du compte. Le rôle de chef se définit par événement (`Event.my_role`).

    EventRole:
      type: string
      enum: [admin, chief, agent]
      description: |
        Rôle de l'utilisateur sur l'événement : `admin`, `chief` (chef agent parking) ou `agent`.

    EventStatus:
      type: string
      enum: [draft, active, closed]
      description: '`draft` brouillon, `active` ouvert, `closed` clôturé (scans refusés).'

    PassStatus:
      type: string
      enum: [pending, registered, revoked]
      description: |
        - `pending` : aucun véhicule enregistré par l'usager
        - `registered` : véhicule enregistré, pass utilisable
        - `revoked` : désactivé par l'admin ou le chef

    Direction:
      type: string
      enum: [in, out]
      description: |
        Sens d'un passage (`in` = entrée, `out` = sortie), ou position d'un véhicule
        (`in` = dans le parking, `out` = dehors).

    ScanResult:
      type: string
      enum: [granted, denied]
      description: '`granted` = passage validé, `denied` = refus tracé.'

    ScanMethod:
      type: string
      enum: [qr, plate]
      description: '`qr` = QR code scanné, `plate` = immatriculation saisie par l''agent.'

    RefusalReason:
      type: string
      enum: [unknown_pass, not_assigned, event_closed, not_registered, revoked, unknown_plate, multiple_matches]
      description: |
        - `unknown_pass` : QR code inconnu
        - `not_assigned` : pass d'un événement auquel l'utilisateur n'est pas affecté
        - `event_closed` : événement clôturé
        - `not_registered` : aucun véhicule enregistré sur le pass
        - `revoked` : pass révoqué
        - `unknown_plate` : immatriculation saisie inconnue sur les événements de l'utilisateur
        - `multiple_matches` : immatriculation présente sur plusieurs événements (voir `matches`)

    # ---------- Ressources ----------

    User:
      type: object
      required: [id, name, email, phone, role]
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: Awa Agent
        email:
          type: string
          format: email
          nullable: true
          description: Facultatif pour un agent ou un chef.
          example: null
        phone:
          type: string
          nullable: true
          description: Identifiant de connexion, sans espaces ni séparateurs. Toujours renseigné pour un agent ou un chef.
          example: '+2250702020200'
        role:
          $ref: '#/components/schemas/UserRole'

    Location:
      type: object
      description: Position GPS de l'agent au moment du scan.
      required: [latitude, longitude, accuracy]
      properties:
        latitude:
          type: number
          format: double
          example: 5.3197012
        longitude:
          type: number
          format: double
          example: -4.0167293
        accuracy:
          type: integer
          nullable: true
          description: Précision en mètres.
          example: 12

    EventRef:
      type: object
      description: Référence courte à un événement.
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Festival de démonstration

    PassType:
      type: object
      description: Catégorie de pass (VIP, Staff, Presse…).
      required: [id, name, code, color]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: VIP
        code:
          type: string
          example: VIP
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Couleur hexadécimale du type, à utiliser à l'affichage.
          example: '#b45309'

    Event:
      type: object
      required: [id, name, code, location, starts_at, ends_at, status, my_role, can_supervise, pass_types]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Festival de démonstration
        code:
          type: string
          example: DEMO26
        location:
          type: string
          nullable: true
          example: Palais de la Culture
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        my_role:
          $ref: '#/components/schemas/EventRole'
        can_supervise:
          type: boolean
          description: '`true` pour le chef de l''événement et les admins.'
        pass_types:
          type: array
          items:
            $ref: '#/components/schemas/PassType'

    Vehicle:
      type: object
      description: Véhicule enregistré par l'usager.
      required: [plate, plate_key, brand, color, phone]
      properties:
        plate:
          type: string
          description: Immatriculation lisible, en majuscules (à afficher).
          example: 1000 AB 01
        plate_key:
          type: string
          description: Immatriculation uniformisée (sans espaces, tirets ni points) — clé de recherche hors ligne.
          example: 1000AB01
        brand:
          type: string
          example: Mercedes-Benz
        color:
          type: string
          example: Bordeaux
        phone:
          type: string
          description: Téléphone de l'usager (pour le joindre si besoin).
          example: '+2250718898224'

    Pass:
      type: object
      required: [id, event_id, number, token, status, status_label, presence, next_direction, type, vehicle, registered_at, last_scanned_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        event_id:
          type: integer
          example: 1
        number:
          type: string
          description: Numéro imprimé sur le pass.
          example: DEMO26-VIP-0001
        token:
          type: string
          description: Jeton du QR code (`/p/{token}`) — clé de recherche en mode hors ligne.
          example: o5kZFFrJ3NA8
        status:
          $ref: '#/components/schemas/PassStatus'
        status_label:
          type: string
          example: Enregistré
        presence:
          allOf:
            - $ref: '#/components/schemas/Direction'
          description: Position actuelle du véhicule (`in` = dans le parking).
        next_direction:
          allOf:
            - $ref: '#/components/schemas/Direction'
          description: Sens du prochain passage (inverse de `presence`).
        type:
          $ref: '#/components/schemas/PassType'
        vehicle:
          type: object
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          nullable: true
          description: '`null` tant que l''usager n''a pas enregistré son véhicule.'
        registered_at:
          type: string
          format: date-time
          nullable: true
        last_scanned_at:
          type: string
          format: date-time
          nullable: true
          description: Dernier passage autorisé.
        updated_at:
          type: string
          format: date-time

    ScanPassSummary:
      type: object
      required: [id, number, plate, type]
      properties:
        id:
          type: integer
          example: 1
        number:
          type: string
          example: DEMO26-VIP-0001
        plate:
          type: string
          nullable: true
          example: 1000 AB 01
        type:
          type: object
          required: [name, color]
          properties:
            name:
              type: string
              example: VIP
            color:
              type: string
              example: '#b45309'

    Scan:
      type: object
      description: Un passage.
      required: [id, client_uuid, direction, result, method, reason, forced, offline, scanned_at, location, event, pass]
      properties:
        id:
          type: integer
          example: 12
        client_uuid:
          type: string
          format: uuid
          nullable: true
        direction:
          $ref: '#/components/schemas/Direction'
        result:
          $ref: '#/components/schemas/ScanResult'
        method:
          $ref: '#/components/schemas/ScanMethod'
        reason:
          type: string
          nullable: true
          description: Motif saisi, ou code `RefusalReason` pour un QR code inconnu / hors événement / forcé.
        forced:
          type: boolean
          description: Passage forcé par un chef malgré un pass non valide.
        offline:
          type: boolean
          description: Passage effectué hors ligne (`POST /scans/batch`).
        scanned_at:
          type: string
          format: date-time
        location:
          type: object
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true
          description: Position de l'agent au moment du scan ; `null` si l'app ne l'a pas envoyée.
        event:
          type: object
          allOf:
            - $ref: '#/components/schemas/EventRef'
          nullable: true
          description: '`null` pour un QR code inconnu ou hors des événements de l''utilisateur.'
        agent:
          type: object
          required: [id, name]
          nullable: true
          description: Auteur du passage — présent uniquement dans `GET /events/{event}/scans`.
          properties:
            id:
              type: integer
            name:
              type: string
        pass:
          type: object
          allOf:
            - $ref: '#/components/schemas/ScanPassSummary'
          nullable: true
          description: '`null` pour un QR code inconnu ou hors des événements de l''utilisateur.'

    # ---------- Requêtes / réponses ----------

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          maxLength: 30
          description: Numéro de téléphone du compte (espaces, points et tirets ignorés).
          example: '+225 07 02 02 02 00'
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 100
          nullable: true
          description: Facultatif. Nom de l'appareil affiché dans le journal (ex. modèle + prénom de l'agent). À défaut, l'en-tête User-Agent est utilisé, ou « Application mobile ».

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'À envoyer dans l''en-tête `Authorization: Bearer <token>`.'
        user:
          $ref: '#/components/schemas/User'

    VerifyRequest:
      type: object
      description: Envoyer `code` (QR code) **ou** `plate` (saisie manuelle).
      properties:
        code:
          type: string
          maxLength: 500
          nullable: true
          description: Contenu brut du QR code (URL complète ou jeton).
        plate:
          type: string
          maxLength: 20
          nullable: true
          description: Immatriculation saisie par l'agent, dans n'importe quel format.

    VerifyResponse:
      type: object
      required: [valid, reason, message, method, can_force, event, pass, matches]
      properties:
        valid:
          type: boolean
          description: '`true` → afficher l''écran vert et le bouton « Valider ».'
        reason:
          type: string
          enum: [unknown_pass, not_assigned, event_closed, not_registered, revoked, unknown_plate, multiple_matches, null]
          nullable: true
          description: Motif (`RefusalReason`) ; `null` si `valid = true`.
        message:
          type: string
          description: Message en français à afficher.
        method:
          $ref: '#/components/schemas/ScanMethod'
        can_force:
          type: boolean
          description: '`true` si l''utilisateur (chef de l''événement / admin) peut forcer ce pass non valide.'
        event:
          type: object
          allOf:
            - $ref: '#/components/schemas/EventRef'
          nullable: true
          description: Événement du pass ; `null` pour `unknown_pass` et `not_assigned`.
        pass:
          type: object
          allOf:
            - $ref: '#/components/schemas/Pass'
          nullable: true
          description: '`null` pour `unknown_pass` et `not_assigned`.'
        matches:
          type: array
          description: Uniquement pour `multiple_matches` (saisie manuelle) — sinon vide.
          items:
            $ref: '#/components/schemas/PlateMatch'

    PlateMatch:
      type: object
      description: Pass correspondant à l'immatriculation saisie, sur l'un des événements de l'agent.
      required: [event, pass]
      properties:
        event:
          $ref: '#/components/schemas/EventRef'
        pass:
          $ref: '#/components/schemas/Pass'

    ScanRequest:
      type: object
      description: Envoyer `code` (QR code) **ou** `plate` (saisie manuelle).
      properties:
        code:
          type: string
          maxLength: 500
          nullable: true
          description: Contenu brut du QR code (URL complète ou jeton).
        plate:
          type: string
          maxLength: 20
          nullable: true
          description: Immatriculation saisie par l'agent (tout format). Le passage est marqué `method = plate`.
        direction:
          type: string
          enum: [in, out, null]
          nullable: true
          description: Sens imposé. Absent → déduit automatiquement (`next_direction`).
        client_uuid:
          type: string
          format: uuid
          nullable: true
          description: UUID généré par l'app — rend l'appel idempotent. **Fortement recommandé.**
        force:
          type: boolean
          default: false
          description: Forcer un pass non valide. Accepté seulement si `can_force = true`.
        reason:
          type: string
          maxLength: 255
          nullable: true
          description: Motif libre (passage forcé ou refus).
        result:
          type: string
          enum: [granted, denied, null]
          nullable: true
          default: granted
          description: Optionnel. `granted` (défaut) valide le passage ; `denied` trace un refus.
        device_id:
          type: string
          maxLength: 100
          nullable: true
          description: Identifiant du terminal (traçabilité).
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Latitude GPS de l'agent (WGS84). Obligatoire si `longitude` est envoyée.
          example: 5.3197012
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Longitude GPS de l'agent (WGS84). Obligatoire si `latitude` est envoyée.
          example: -4.0167293
        accuracy:
          type: number
          minimum: 0
          maximum: 100000
          nullable: true
          description: Précision de la position, en mètres.
          example: 12

    ScanResponse:
      type: object
      required: [scan, pass]
      properties:
        scan:
          $ref: '#/components/schemas/Scan'
        pass:
          type: object
          allOf:
            - $ref: '#/components/schemas/Pass'
          nullable: true
          description: Pass avec sa nouvelle position (`presence`). `null` si aucun pass rattaché.

    ScanRefused:
      type: object
      description: Passage refusé par le serveur (pass non valide).
      required: [message, reason, can_force, matches]
      properties:
        message:
          type: string
          description: Message en français à afficher.
        reason:
          $ref: '#/components/schemas/RefusalReason'
        can_force:
          type: boolean
          description: '`true` → le chef peut renvoyer la requête avec `force: true`.'
        matches:
          type: array
          description: Pass correspondants si `reason = multiple_matches`.
          items:
            $ref: '#/components/schemas/PlateMatch'

    BatchScanItem:
      type: object
      description: '`code` (QR code) **ou** `plate` (saisie manuelle).'
      required: [client_uuid, result, direction, scanned_at]
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Unique (clé d'idempotence).
        code:
          type: string
          maxLength: 500
          nullable: true
        plate:
          type: string
          maxLength: 20
          nullable: true
          description: Immatriculation saisie hors ligne (tout format).
        result:
          $ref: '#/components/schemas/ScanResult'
        direction:
          $ref: '#/components/schemas/Direction'
        scanned_at:
          type: string
          format: date-time
          description: Heure réelle du scan (avec fuseau).
        reason:
          type: string
          maxLength: 255
          nullable: true
        forced:
          type: boolean
          default: false
        device_id:
          type: string
          maxLength: 100
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Latitude GPS au moment du scan hors ligne. Obligatoire si `longitude` est envoyée.
          example: 5.3197012
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Longitude GPS au moment du scan hors ligne. Obligatoire si `latitude` est envoyée.
          example: -4.0167293
        accuracy:
          type: number
          minimum: 0
          maximum: 100000
          nullable: true
          description: Précision de la position, en mètres.
          example: 12

    BatchScanRequest:
      type: object
      required: [scans]
      properties:
        scans:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BatchScanItem'

    BatchScanResponse:
      type: object
      required: [created, duplicates, results]
      properties:
        created:
          type: integer
        duplicates:
          type: integer
        results:
          type: array
          description: Dans l'ordre chronologique de `scanned_at`.
          items:
            type: object
            required: [client_uuid, status]
            properties:
              client_uuid:
                type: string
                format: uuid
              status:
                type: string
                enum: [created, duplicate]
                description: Dans les deux cas, le passage peut être retiré de la file locale.

    SyncResponse:
      type: object
      required: [server_time, full, events, passes, deleted_pass_ids]
      properties:
        server_time:
          type: string
          format: date-time
          description: À renvoyer dans `since` à la prochaine synchro.
        full:
          type: boolean
          description: '`true` → liste complète : remplacez le cache local.'
        events:
          type: array
          description: Événements non clôturés de l'utilisateur (liste toujours complète).
          items:
            $ref: '#/components/schemas/Event'
        passes:
          type: array
          items:
            $ref: '#/components/schemas/Pass'
        deleted_pass_ids:
          type: array
          description: Pass supprimés depuis `since`, à retirer du cache local. Toujours vide si `full = true`.
          items:
            type: integer
          example: [42, 43]

    Stats:
      type: object
      required: [passes, scans, by_type]
      properties:
        passes:
          type: object
          required: [total, pending, registered, revoked, inside]
          properties:
            total:
              type: integer
            pending:
              type: integer
            registered:
              type: integer
            revoked:
              type: integer
            inside:
              type: integer
              description: Véhicules actuellement dans le parking.
        scans:
          type: object
          required: [entries, exits, denied, manual]
          properties:
            entries:
              type: integer
            exits:
              type: integer
            denied:
              type: integer
            manual:
              type: integer
              description: Passages identifiés par saisie de l'immatriculation (sans QR code).
        by_type:
          type: array
          items:
            type: object
            required: [id, name, color, total, registered, inside]
            properties:
              id:
                type: integer
              name:
                type: string
              color:
                type: string
              total:
                type: integer
              registered:
                type: integer
              inside:
                type: integer

    PaginatedScans:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Scan'
        links:
          type: object
          properties:
            first:
              type: string
              nullable: true
            last:
              type: string
              nullable: true
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
              description: '`null` sur la dernière page.'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
              nullable: true
            last_page:
              type: integer
            path:
              type: string
            per_page:
              type: integer
            to:
              type: integer
              nullable: true
            total:
              type: integer
            links:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    nullable: true
                  label:
                    type: string
                  active:
                    type: boolean

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          description: Premier message d'erreur (suivi de « (et N erreurs de plus) » s'il y en a plusieurs).
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
